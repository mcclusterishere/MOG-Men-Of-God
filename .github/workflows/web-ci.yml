name: Web PWA CI

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "manifest.webmanifest"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "manifest.webmanifest"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-and-installability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run browser privacy and PWA tests
        run: node --test tests/*.test.js
