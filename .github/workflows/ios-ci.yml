name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime in sorted(data["devices"], reverse=True):
              for device in data["devices"][runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/PeopleOfGod.xcodeproj \
            -scheme PeopleOfGod \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/PeopleOfGodDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture real iPhone simulator screens
        shell: bash
        run: |
          set -euo pipefail
          device_id="${{ steps.simulator.outputs.id }}"
          app_path="$RUNNER_TEMP/PeopleOfGodDerivedData/Build/Products/Debug-iphonesimulator/People of God.app"
          output_path="$RUNNER_TEMP/people-of-god-screenshots"

          mkdir -p "$output_path"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl status_bar "$device_id" override \
            --time 9:41 \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4 2>/dev/null || true

          for screen in welcome home checkin support; do
            xcrun simctl launch --terminate-running-process "$device_id" \
              org.mccluster.peopleofgod \
              -POGScreenshotScreen "$screen"
            sleep 3
            xcrun simctl io "$device_id" screenshot "$output_path/$screen.png"
          done

      - name: Upload iPhone screenshots
        uses: actions/upload-artifact@v4
        with:
          name: people-of-god-iphone-screenshots
          path: ${{ runner.temp }}/people-of-god-screenshots/*.png
          if-no-files-found: error
